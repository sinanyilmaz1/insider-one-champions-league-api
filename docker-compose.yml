services:
  postgres:
    image: postgres:17-alpine
    container_name: insider_one_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insider_one
      POSTGRES_USER: insider_one
      POSTGRES_PASSWORD: insider_one_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insider_one -d insider_one"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: insider_one_postgres_data